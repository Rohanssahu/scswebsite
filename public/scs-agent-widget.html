<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SCS Agent Widget</title>
</head>
<body>

<!-- ============================================================
     SCS AGENT WIDGET — single self-contained block.
     Paste everything between START and END into any page (just
     before </body>). No frameworks, no CDN, no storage.

     Wire your API:
       window.scsAgent.onMessage = async (text) => {
         const res = await fetch('/api/estimate-chat', {
           method: 'POST',
           headers: { 'Content-Type': 'application/json' },
           body: JSON.stringify({ message: text })
         });
         return (await res.json()).reply;   // returned string is shown
       };
     Or push replies yourself at any time:
       window.scsAgent.reply('Here is your estimate…');
     ============================================================ -->
<!-- SCS Agent Widget START -->
<div id="scs-agent-root">

<style>
  /* ---------- SCS Agent Widget (scoped by #scs-agent-root) ---------- */
  #scs-agent-root {
    --scs-purple: #9333EA;
    --scs-purple-light: #C084FC;
    --scs-purple-dark: #7E22CE;
    --scs-orange: #F97316;
    --scs-orange-light: #FDBA74;
    --scs-body: #FDF9FF;
    --scs-lav: #F3E8FF;
    --scs-lav-deep: #E9D5FF;
    --scs-visor: #2E1065;
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 2147483000;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  #scs-agent-root *, #scs-agent-root *::before, #scs-agent-root *::after { box-sizing: border-box; }

  /* ---------- Launcher / robot ---------- */
  .scs-launcher {
    border: 0;
    background: transparent;
    padding: 0;
    cursor: pointer;
    line-height: 0;
    transition: transform 0.2s ease;
  }
  .scs-launcher:hover, .scs-launcher:focus-visible { transform: scale(1.05); }
  .scs-launcher:focus-visible { outline: 3px solid var(--scs-purple-light); outline-offset: 4px; border-radius: 16px; }
  .scs-launcher svg { height: 72px; width: auto; overflow: visible; }

  .scs-bot { animation: scs-float 3s ease-in-out infinite; }
  @keyframes scs-float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  .scs-eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: scs-blink 4.5s ease-in-out infinite;
  }
  @keyframes scs-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.15); }
  }
  .scs-arm-wave {
    transform-box: fill-box;
    transform-origin: 50% 90%;
    transform: rotate(14deg);
    transition: transform 0.3s ease;
  }
  .scs-launcher:hover .scs-arm-wave,
  .scs-launcher:focus-visible .scs-arm-wave {
    animation: scs-wave 0.9s ease-in-out infinite;
  }
  @keyframes scs-wave {
    0%, 100% { transform: rotate(10deg); }
    50%      { transform: rotate(38deg); }
  }

  /* ---------- Greeting bubble ---------- */
  .scs-greeting {
    max-width: 220px;
    background: #ffffff;
    color: #2a2140;
    border: 1px solid var(--scs-lav);
    border-radius: 16px 16px 4px 16px;
    box-shadow: 0 8px 24px rgba(236, 72, 153, 0.2);
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .scs-greeting.scs-show { opacity: 1; transform: translateY(0); }

  /* ---------- Chat panel ---------- */
  .scs-panel {
    position: fixed;
    right: 24px;
    bottom: 108px;
    width: 360px;
    height: 480px;
    max-width: calc(100vw - 48px);
    max-height: calc(100vh - 140px);
    display: none;
    flex-direction: column;
    background: #ffffff;
    border: 1px solid var(--scs-lav);
    border-radius: 18px;
    box-shadow: 0 16px 48px rgba(46, 16, 101, 0.28);
    overflow: hidden;
  }
  .scs-panel.scs-open { display: flex; }

  .scs-panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--scs-purple);
    color: #ffffff;
  }
  .scs-panel-header svg { height: 34px; width: auto; flex: none; }
  .scs-panel-title { flex: 1; min-width: 0; }
  .scs-panel-title strong { display: block; font-size: 14px; }
  .scs-panel-title span { display: block; font-size: 11px; opacity: 0.85; }
  .scs-close {
    border: 0;
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    flex: none;
  }
  .scs-close:hover, .scs-close:focus-visible { background: rgba(255, 255, 255, 0.3); outline: none; }

  .scs-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--scs-body);
  }
  .scs-msg {
    max-width: 82%;
    padding: 9px 12px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .scs-msg.scs-agent-msg {
    align-self: flex-start;
    background: #ffffff;
    border: 1px solid var(--scs-lav);
    border-bottom-left-radius: 4px;
    color: #2a2140;
  }
  .scs-msg.scs-user-msg {
    align-self: flex-end;
    background: var(--scs-purple);
    border-bottom-right-radius: 4px;
    color: #ffffff;
  }

  .scs-input-row {
    display: flex;
    gap: 8px;
    padding: 10px;
    border-top: 1px solid var(--scs-lav);
    background: #ffffff;
  }
  .scs-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--scs-lav-deep);
    border-radius: 999px;
    padding: 10px 14px;
    font-size: 13px;
    font-family: inherit;
    color: #2a2140;
  }
  .scs-input:focus { outline: 2px solid var(--scs-purple-light); border-color: var(--scs-purple-light); }
  .scs-send {
    border: 0;
    background: var(--scs-orange);
    color: #ffffff;
    border-radius: 999px;
    padding: 0 16px;
    min-height: 40px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .scs-send:hover, .scs-send:focus-visible { background: #EA580C; outline: none; }

  /* ---------- Mobile ---------- */
  @media (max-width: 639px) {
    .scs-launcher svg { height: 56px; }
    .scs-panel {
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      border-radius: 0;
      border: 0;
    }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .scs-bot, .scs-eye, .scs-arm-wave { animation: none !important; }
    .scs-launcher, .scs-launcher:hover, .scs-launcher:focus-visible { transform: none; transition: none; }
    .scs-greeting { transition: opacity 0.2s ease; transform: none; }
  }
</style>

<!-- Greeting bubble -->
<div class="scs-greeting" id="scs-greeting" role="status">Need a project estimate?</div>

<!-- Launcher: the robot -->
<button
  type="button"
  class="scs-launcher"
  id="scs-launcher"
  aria-label="Open SCS project estimate assistant"
  aria-expanded="false"
  aria-controls="scs-panel"
>
  <svg viewBox="0 -12 120 140" role="img" aria-hidden="true" focusable="false">
    <!-- Ground shadow (floating pose) -->
    <ellipse cx="60" cy="124" rx="26" ry="5" fill="#1B1038" opacity="0.12" />
    <g class="scs-bot">
      <!-- Left arm resting down -->
      <rect x="22" y="72" width="13" height="26" rx="6.5" fill="#F6F1FB" stroke="#E2D5F0" stroke-width="2" />
      <!-- Right arm raised, waving -->
      <g class="scs-arm-wave">
        <rect x="85" y="52" width="13" height="30" rx="6.5" fill="#F6F1FB" stroke="#E2D5F0" stroke-width="2" />
      </g>
      <!-- Rounded body -->
      <rect x="33" y="60" width="54" height="54" rx="25" fill="#FFFFFF" stroke="#EDE4F7" stroke-width="2" />
      <ellipse cx="60" cy="105" rx="19" ry="7" fill="#F3EDFA" />
      <!-- Belly seam + button -->
      <path d="M 40 92 Q 60 98 80 92" fill="none" stroke="#E2D5F0" stroke-width="2" stroke-linecap="round" />
      <circle cx="60" cy="95" r="3" fill="#DDD0F0" stroke="#B49CD8" stroke-width="1" />
      <!-- Antenna -->
      <line x1="60" y1="6" x2="60" y2="-2" stroke="#CFC0E8" stroke-width="3" stroke-linecap="round" />
      <circle cx="60" cy="-6" r="4.5" fill="#F97316" stroke="#C2410C" stroke-width="1.5" />
      <!-- Head -->
      <rect x="26" y="4" width="68" height="52" rx="22" fill="#FFFFFF" stroke="#EDE4F7" stroke-width="2" />
      <ellipse cx="47" cy="11" rx="14" ry="3.5" fill="#F6F1FB" />
      <!-- Ear nubs -->
      <circle cx="25" cy="30" r="6" fill="#C084FC" stroke="#9333EA" stroke-width="1.5" />
      <circle cx="95" cy="30" r="6" fill="#C084FC" stroke="#9333EA" stroke-width="1.5" />
      <!-- Dark visor -->
      <rect x="34" y="12" width="52" height="37" rx="15" fill="#2E1065" stroke="#1E0A47" stroke-width="1.5" />
      <ellipse cx="50" cy="18" rx="12" ry="3.5" fill="#FFFFFF" opacity="0.08" />
      <!-- Happy glowing eyes -->
      <path class="scs-eye" d="M 44 34 Q 49 26 54 34" fill="none" stroke="#F9A8D4" stroke-width="4" stroke-linecap="round" />
      <path class="scs-eye" d="M 66 34 Q 71 26 76 34" fill="none" stroke="#F9A8D4" stroke-width="4" stroke-linecap="round" />
      <!-- Small open smile -->
      <path d="M 55 39 A 5 5 0 0 0 65 39 Z" fill="#F9A8D4" />
    </g>
  </svg>
</button>

<!-- Chat panel -->
<div class="scs-panel" id="scs-panel" role="dialog" aria-modal="true" aria-label="SCS estimate assistant chat" hidden>
  <div class="scs-panel-header">
    <svg viewBox="14 -12 92 100" aria-hidden="true" focusable="false">
      <rect x="26" y="4" width="68" height="52" rx="22" fill="#FFFFFF" />
      <circle cx="25" cy="30" r="6" fill="#C084FC" />
      <circle cx="95" cy="30" r="6" fill="#C084FC" />
      <line x1="60" y1="6" x2="60" y2="-2" stroke="#C084FC" stroke-width="3" stroke-linecap="round" />
      <circle cx="60" cy="-6" r="4.5" fill="#F97316" />
      <rect x="34" y="12" width="52" height="37" rx="15" fill="#2E1065" />
      <path d="M 44 34 Q 49 26 54 34" fill="none" stroke="#F9A8D4" stroke-width="4" stroke-linecap="round" />
      <path d="M 66 34 Q 71 26 76 34" fill="none" stroke="#F9A8D4" stroke-width="4" stroke-linecap="round" />
      <path d="M 55 39 A 5 5 0 0 0 65 39 Z" fill="#F9A8D4" />
    </svg>
    <div class="scs-panel-title">
      <strong>Buddy — SCS AI Agent</strong>
      <span>Project cost estimator</span>
    </div>
    <button type="button" class="scs-close" id="scs-close" aria-label="Close chat">✕</button>
  </div>
  <div class="scs-messages" id="scs-messages" aria-live="polite"></div>
  <form class="scs-input-row" id="scs-form">
    <input
      class="scs-input"
      id="scs-input"
      type="text"
      autocomplete="off"
      placeholder="Describe your project…"
      aria-label="Type your message"
    />
    <button type="submit" class="scs-send">Send</button>
  </form>
</div>

<script>
(function () {
  'use strict';
  var root = document.getElementById('scs-agent-root');
  var launcher = document.getElementById('scs-launcher');
  var greeting = document.getElementById('scs-greeting');
  var panel = document.getElementById('scs-panel');
  var closeBtn = document.getElementById('scs-close');
  var messages = document.getElementById('scs-messages');
  var form = document.getElementById('scs-form');
  var input = document.getElementById('scs-input');
  var open = false;

  function addMsg(kind, text) {
    var el = document.createElement('div');
    el.className = 'scs-msg ' + (kind === 'user' ? 'scs-user-msg' : 'scs-agent-msg');
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }

  /* ---------- public API ---------- */
  window.scsAgent = {
    /* Assign your handler: (text) => string | Promise<string> | void */
    onMessage: null,
    /* Push an agent reply into the chat at any time. */
    reply: function (text) { if (text) addMsg('agent', String(text)); },
    open: function () { setOpen(true); },
    close: function () { setOpen(false); },
    toggle: function () { setOpen(!open); }
  };

  /* ---------- greeting bubble: in at 4s, out at 12s ---------- */
  var greetIn = setTimeout(function () {
    if (!open) greeting.classList.add('scs-show');
  }, 4000);
  var greetOut = setTimeout(hideGreeting, 12000);
  function hideGreeting() {
    greeting.classList.remove('scs-show');
    clearTimeout(greetIn);
    clearTimeout(greetOut);
  }

  /* ---------- open / close ---------- */
  function setOpen(next) {
    open = next;
    panel.hidden = !open;
    panel.classList.toggle('scs-open', open);
    launcher.setAttribute('aria-expanded', String(open));
    if (open) {
      hideGreeting();
      if (!messages.childElementCount) {
        addMsg('agent', "Hi! I'm Buddy from SCS Softwares. Tell me about your project and I'll help estimate its cost.");
      }
      input.focus();
    } else {
      launcher.focus();
    }
  }

  launcher.addEventListener('click', function () { setOpen(!open); });
  closeBtn.addEventListener('click', function () { setOpen(false); });

  /* Escape closes; Tab is trapped inside the open panel. */
  document.addEventListener('keydown', function (e) {
    if (!open) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      setOpen(false);
      return;
    }
    if (e.key === 'Tab') {
      var focusables = panel.querySelectorAll('button, input, [href], [tabindex]:not([tabindex="-1"])');
      if (!focusables.length) return;
      var first = focusables[0];
      var last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      } else if (!panel.contains(document.activeElement)) {
        e.preventDefault();
        first.focus();
      }
    }
  });

  /* ---------- sending ---------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMsg('user', text);
    var handler = window.scsAgent.onMessage;
    if (typeof handler === 'function') {
      try {
        var result = handler(text);
        if (result && typeof result.then === 'function') {
          result.then(function (r) { if (typeof r === 'string' && r) addMsg('agent', r); })
                .catch(function () { addMsg('agent', 'Sorry, something went wrong. Please try again.'); });
        } else if (typeof result === 'string' && result) {
          addMsg('agent', result);
        }
      } catch (err) {
        addMsg('agent', 'Sorry, something went wrong. Please try again.');
      }
    } else {
      addMsg('agent', 'Thanks! (Demo mode — connect your API via window.scsAgent.onMessage to power real answers.)');
    }
  });
})();
</script>

</div>
<!-- SCS Agent Widget END -->

</body>
</html>
