# Supabase CLI project configuration.
# project_id is the LOCAL name for this project directory (not a secret).

project_id = "scswebsite"

# submit-lead is a deliberately public endpoint: browsers call it with the
# sb_publishable_* key, which is not a JWT, so platform JWT verification must
# be off for THIS function only. Its access control lives in the function
# itself: origin allowlist, server-side Turnstile verification, honeypot,
# strict validation, rate limiting and a body-size cap.
[functions.submit-lead]
verify_jwt = false

# livekit-token is a deliberately public endpoint like submit-lead: browsers
# call it with the sb_publishable_* key. Its access control lives in the
# function itself: origin allowlist, server-side Turnstile verification,
# strict validation, per-IP rate limiting, a body-size cap and a global
# VOICE_AGENT_ENABLED kill switch.
[functions.livekit-token]
verify_jwt = false

# voice-lead is server-to-server ONLY (Buddy agent worker → Supabase). It is
# not called from any browser: no CORS, and every request must present the
# VOICE_AGENT_SECRET shared key. JWT verification is off because the worker
# authenticates with that shared secret instead of a Supabase JWT.
[functions.voice-lead]
verify_jwt = false

# consultation-meeting is a deliberately public endpoint like livekit-token:
# browsers call it with the sb_publishable_* key. Its access control lives in
# the function itself: origin allowlist, Turnstile on create/join, honeypot,
# strict validation, per-IP rate limiting, a body-size cap, a scoped meeting
# access token (hash-stored) and a global CONSULTATION_ENABLED kill switch.
[functions.consultation-meeting]
verify_jwt = false

# consultation-agent is server-to-server ONLY (Buddy agent worker → Supabase),
# exactly like voice-lead: no CORS, VOICE_AGENT_SECRET shared-key auth.
[functions.consultation-agent]
verify_jwt = false
