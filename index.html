<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Apply the saved/auto-detected language direction before first paint
         (RTL for Arabic/Urdu). The i18n runtime keeps it in sync afterwards. -->
    <script>
      (function () {
        try {
          var rtl = { ar: 1, ur: 1 };
          var raw = localStorage.getItem('scs-lang-v2') || sessionStorage.getItem('scs-lang-v2');
          var code = raw ? (JSON.parse(raw) || {}).code : null;
          if (!code) {
            var langs = navigator.languages || [navigator.language];
            for (var i = 0; i < langs.length; i++) {
              var base = (langs[i] || '').toLowerCase().split('-')[0];
              if (base === 'ar' || base === 'ur' || base === 'en') { code = base; break; }
            }
          }
          if (code) {
            document.documentElement.lang = code;
            document.documentElement.dir = rtl[code] ? 'rtl' : 'ltr';
          }
        } catch (e) { /* defaults stay English LTR */ }
      })();
    </script>

    <!-- SEO_HEAD:START — everything between these markers is generated.
         `scripts/prerender.mjs` replaces this block per route with the tags
         serialized from `src/seo/registry.ts`, so the crawler sees the right
         title, description, canonical and robots before any JavaScript runs.
         The values below are the homepage defaults and must stay identical to
         the registry's `/` entry — `src/seo/indexHtml.test.ts` enforces that. -->
    <title>SCS Softwares | AI, Mobile App &amp; Custom Software Development in India</title>
    <meta name="description" content="India-based mobile app, web application, custom software and AI development company specializing in AI/ML, AI voice agents, AI video consultation agents and business automation." data-scs-seo="description" />
    <meta name="robots" content="index,follow" data-scs-seo="robots" />
    <meta name="googlebot" content="index,follow" data-scs-seo="googlebot" />
    <meta name="author" content="SCS Softwares" data-scs-seo="author" />
    <link rel="canonical" href="https://scssoftwares.com/" data-scs-seo="canonical" />
    <meta property="og:title" content="SCS Softwares — AI, Mobile &amp; Custom Software Development" data-scs-seo="og:title" />
    <meta property="og:description" content="India-based mobile app, web application, custom software and AI development company specializing in AI/ML, AI voice agents, AI video consultation agents and business automation." data-scs-seo="og:description" />
    <meta property="og:type" content="website" data-scs-seo="og:type" />
    <meta property="og:url" content="https://scssoftwares.com/" data-scs-seo="og:url" />
    <meta property="og:site_name" content="SCS Softwares" data-scs-seo="og:site_name" />
    <meta property="og:locale" content="en_IN" data-scs-seo="og:locale" />
    <meta property="og:image" content="https://scssoftwares.com/images/og-cover.png" data-scs-seo="og:image" />
    <meta property="og:image:alt" content="SCS Softwares" data-scs-seo="og:image:alt" />
    <meta name="twitter:card" content="summary_large_image" data-scs-seo="twitter:card" />
    <meta name="twitter:title" content="SCS Softwares — AI, Mobile &amp; Custom Software Development" data-scs-seo="twitter:title" />
    <meta name="twitter:description" content="India-based mobile app, web application, custom software and AI development company specializing in AI/ML, AI voice agents, AI video consultation agents and business automation." data-scs-seo="twitter:description" />
    <meta name="twitter:image" content="https://scssoftwares.com/images/og-cover.png" data-scs-seo="twitter:image" />
    <meta name="twitter:image:alt" content="SCS Softwares" data-scs-seo="twitter:image:alt" />
    <meta name="twitter:site" content="@scssoftwares" data-scs-seo="twitter:site" />
    <meta name="twitter:creator" content="@scssoftwares" data-scs-seo="twitter:creator" />
    <!-- SEO_HEAD:END -->

    <link rel="icon" href="/favicon.ico" />

  </head>
